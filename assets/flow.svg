<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
  <title id="t">How OmniView works</title><desc id="d">A file flows from drop or paste, through type detection and the registry, to a lazy-loaded viewer, then to the screen. Nothing leaves the browser.</desc>
  <defs>
    <linearGradient id="c1" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="c2" x1="0" x2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="c3" x1="0" x2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <linearGradient id="c4" x1="0" x2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="c5" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="250" rx="22" fill="#0f172a"/>
  <rect x="14" y="14" width="1172" height="222" rx="16" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="10 10" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.5s" repeatCount="indefinite"/></rect>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#34d399" letter-spacing="3">EVERYTHING BELOW HAPPENS INSIDE YOUR BROWSER TAB</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" filter="url(#sh)">
    <g><rect x="40" y="80" width="190" height="110" rx="16" fill="url(#c1)"/><text x="135" y="124" font-size="20" font-weight="700" fill="#0b1020">Drop · Pick</text><text x="135" y="150" font-size="20" font-weight="700" fill="#0b1020">Paste · Folder</text><text x="135" y="176" font-size="13" fill="#0b1020" opacity=".75">multi-file aware</text></g>
    <g><rect x="270" y="80" width="190" height="110" rx="16" fill="url(#c2)"/><text x="365" y="124" font-size="20" font-weight="700" fill="#0b1020">fileSniffer</text><text x="365" y="150" font-size="14" fill="#0b1020">magic bytes → ZIP → ext</text><text x="365" y="172" font-size="14" fill="#0b1020">then extension / MIME</text></g>
    <g><rect x="500" y="80" width="190" height="110" rx="16" fill="url(#c3)"/><text x="595" y="124" font-size="20" font-weight="700" fill="#0b1020">registry</text><text x="595" y="150" font-size="14" fill="#0b1020">kind → lazy viewer</text><text x="595" y="172" font-size="14" fill="#0b1020">one entry per format</text></g>
    <g><rect x="730" y="80" width="190" height="110" rx="16" fill="url(#c4)"/><text x="825" y="124" font-size="20" font-weight="700" fill="#0b1020">Viewer chunk</text><text x="825" y="150" font-size="14" fill="#0b1020">Web Workers · WASM</text><text x="825" y="172" font-size="14" fill="#0b1020">cancel on file switch</text></g>
    <g><rect x="960" y="80" width="200" height="110" rx="16" fill="url(#c5)"/><text x="1060" y="124" font-size="20" font-weight="700" fill="#052e2b">Your screen</text><text x="1060" y="150" font-size="14" fill="#052e2b">canvas · img · DOM · 3D</text><text x="1060" y="172" font-size="14" fill="#052e2b">memory freed on exit</text></g>
  </g>
  <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linecap="round">
    <path id="p1" d="M232 135 H266"/><path id="p2" d="M462 135 H496"/><path id="p3" d="M692 135 H726"/><path id="p4" d="M922 135 H956"/></g>
  <g fill="#fff">
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M40 215 H1160" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="5" opacity=".7"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M40 215 H1160"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="5" opacity=".5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M40 215 H1160"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <line x1="40" y1="215" x2="1160" y2="215" stroke="#334155" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="600" y="233" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">no upload · no analytics · no third-party requests</text>
</svg>
