<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">OmniView</title><desc id="d">Animated banner: OmniView, open anything, upload nothing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#1a1442"/><stop offset="1" stop-color="#0b2a4a"/>
      <animate attributeName="x1" values="0;.4;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;.6;0" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.6;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="type"><rect x="0" y="0" height="340" width="900"><animate attributeName="width" values="0;0;900;900;0" keyTimes="0;.06;.5;.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".55">
    <circle r="120" fill="#22d3ee"><animate attributeName="cx" values="140;380;140" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="80;250;80" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="130" fill="#a78bfa"><animate attributeName="cx" values="640;860;640" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="260;70;260" dur="10s" repeatCount="indefinite"/></circle>
    <circle r="110" fill="#f472b6"><animate attributeName="cx" values="1060;820;1060" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="90;260;90" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <g opacity=".5" fill="#ffffff">
    <circle cx="90" cy="60" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="300" r="2"><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="45" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="290" r="2"><animate attributeName="opacity" values="1;.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="310" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- eye mark -->
  <g transform="translate(150 150)">
    <path d="M-78 0 C-48 -52 48 -52 78 0 C48 52 -48 52 -78 0Z" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 420;420 0;420 0;0 420" keyTimes="0;.35;.85;1" dur="6s" repeatCount="indefinite"/></path>
    <circle r="22" fill="url(#ring)"><animate attributeName="r" values="22;27;22" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="8" cy="-8" r="6" fill="#fff" opacity=".9"/>
    <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M-100 -60 l0 -16 l16 0"/><path d="M100 -60 l0 -16 l-16 0"/><path d="M-100 60 l0 16 l16 0"/><path d="M100 60 l0 16 l-16 0"/>
      <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></g>
  </g>
  <text x="270" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2" fill="url(#ttl)">OmniView</text>
  <g clip-path="url(#type)">
    <text x="274" y="228" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="34" fill="#e2e8f0">Open anything. Upload nothing.</text>
  </g>
  <rect x="892" y="200" width="3" height="36" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="274;274;892;892;274" keyTimes="0;.06;.5;.9;1" dur="9s" repeatCount="indefinite"/></rect>
  <text x="274" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">View-only universal file viewer · 30+ formats · 100% in your browser</text>
</svg>
