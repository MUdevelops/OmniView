services:
  converter:
    build: .
    ports: ["8080:8080"]
    environment:
      ENABLE_CONVERSION: "true"                 # off by default; this is the switch
      ALLOWED_ORIGIN: "http://localhost:4173"   # the origin your OmniView is served from
      MAX_UPLOAD_MB: "50"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
