server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (CSP, nosniff, referrer policy, permissions policy). Generated from config/headers.ts.
  include /etc/nginx/security-headers.conf;

  # Correct MIME type for WebAssembly (required for streaming compile).
  include /etc/nginx/mime.types;
  types { application/wasm wasm; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location = /index.html { expires -1; }
  location = /sw.js { expires -1; }
  location /assets/ { expires 1y; }
  location / { try_files $uri $uri/ /index.html; }
}
